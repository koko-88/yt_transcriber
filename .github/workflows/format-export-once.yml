name: Format export once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Prettier to export files
        run: npx prettier --write src/core/export-docs.ts src/core/export-templates.ts src/ui/components/ActionsMenu.tsx src/ui/views/ExportView.tsx src/ui/panel-layout.css

      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-export-once.yml
          git add src/core/export-docs.ts src/core/export-templates.ts src/ui/components/ActionsMenu.tsx src/ui/views/ExportView.tsx src/ui/panel-layout.css
          git commit -m "style: format export workflow"
          git push origin HEAD:main