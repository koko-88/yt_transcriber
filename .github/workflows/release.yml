name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Verify
        run: |
          npm run compile
          npm run lint
          npm run format:check
          npm run test

      - name: Build and package
        run: |
          npm run zip:all
          npm run checksums

      - name: Mozilla add-on lint
        run: npm run web-ext:lint

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ".output/*.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
            .output/SHA256SUMS.txt
          generate_release_notes: true
          draft: true

  # Store submission is intentionally gated behind the protected `release`
  # environment (manual approval) AND requires credentials that are not
  # available in CI yet. Enable by uncommenting and configuring the environment
  # secrets listed in docs/GITHUB_SETUP.md.
